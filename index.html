<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="flex-col mx-auto px-20px max-w-[300px] text-center">
      <div class="flex-col">
        <h2 class="font-bold text-2xl mb-4">
          Get the right plan for future product.
        </h2>
        <ul class="flex justify-center text-base mb-8">
          <li>
            <button
              class="font-bold text-base w-[120px] py-4 bg-gray-100 rounded-tl-xl rounded-bl-xl"
            >
              Yearly
            </button>
          </li>
          <li>
            <button
              class="font-bold text-base w-[120px] py-4 bg-gray-100 rounded-tr-xl rounded-br-xl"
            >
              Monthly
            </button>
          </li>
        </ul>
      </div>
      <ul class="flex-col text-lg w-[280px] mx-auto">
        <!--margin ~ 20 width 330 -->
        <li
          class="text-center mb-7 bg-gray-100 rounded-xl group duration-300 hover:scale-110 focus:scale-110 hover:bg-[#FF703B] focus:bg-[#FF703B]"
        >
          <p class="mb-3 pt-3 group-focus:text-white">Starter</p>
          <h3 class="font-bold text-2xl mb-6 group-focus:text-white">Free</h3>
          <p class="mb-3 group-focus:text-white">1 Website</p>
          <p class="mb-3 group-focus:text-white">5 GB Hosting</p>
          <p class="mb-10 group-focus:text-white">Limited Support</p>
          <button
            class="mb-8 py-4 w-[200px] bg-white rounded-xl group-hover:text-white group-focus:text-white group-hover:bg-[#9F3919]"
          >
            Get Started
          </button>
        </li>
        <li
          class="text-center mb-7 bg-gray-100 rounded-xl group duration-300 hover:scale-110 focus:scale-110 hover:bg-[#FF703B] focus:bg-[#FF703B]"
        >
          <p class="mb-3 pt-3 group-focus:text-white">Premium</p>
          <h3 class="font-bold text-2xl mb-6 group-focus:text-white">
            $29<span class="text-xl">/month</span>
          </h3>
          <p class="mb-3 group-focus:text-white">10 Website</p>
          <p class="mb-3 group-focus:text-white">15 GB Hosting</p>
          <p class="mb-10 group-focus:text-white">Premium Support</p>
          <button
            class="mb-8 py-4 w-[200px] bg-white rounded-xl group-hover:text-white group-focus:text-white group-hover:bg-[#9F3919]"
          >
            Get Started
          </button>
        </li>
        <li
          class="text-center mb-12 bg-gray-100 rounded-xl group duration-300 hover:scale-110 focus:scale-110 hover:bg-[#FF703B] focus:bg-[#FF703B]"
        >
          <p class="mb-3 pt-3 group-hover:text-white group-focus:text-white">
            Enterprise
          </p>
          <h3
            class="font-bold text-2xl mb-6 group-hover:text-white group-focus:text-white"
          >
            $49<span class="text-xl">/month</span>
          </h3>
          <p class="mb-3 group-hover:text-white group-focus:text-white">
            Unlimited Website
          </p>
          <p class="mb-3 group-hover:text-white group-focus:text-white">
            50 GB Hosting
          </p>
          <p class="mb-10 group-hover:text-white group-focus:text-white">
            Premium Support
          </p>
          <button
            class="mb-8 py-4 w-[200px] bg-white rounded-xl group-hover:text-white group-focus:text-white group-hover:bg-[#9F3919]"
          >
            Get Started
          </button>
        </li>
      </ul>
    </div>
  </body>
</html>
