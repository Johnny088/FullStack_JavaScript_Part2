<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="flex-col">
      <div class="flex">
        <h2 class="plan__duration__title">
          Get the right plan for future product.
        </h2>
        <ul class="plan__btn__wrap">
          <li><button class="plan__duration__btn blue">Yearly</button></li>
          <li><button class="plan__duration__btn">Monthly</button></li>
        </ul>
      </div>
      <ul class="plan__price">
        <!--margin ~ 20 width 330 -->
        <li class="plan__price__item">
          <p class="plan__price__type">Starter</p>
          <h3 class="plan__price__title">Free</h3>
          <p class="plan__price__description">1 Website</p>
          <p class="plan__price__description">5 GB Hosting</p>
          <p class="plan__price__description plan__price__last">
            Limited Support
          </p>
          <button class="plan__price__btn">Get Started</button>
        </li>
        <li class="plan__price__item">
          <p class="plan__price__type">Premium</p>
          <h3 class="plan__price__title">
            $29<span class="plan__price__span">/month</span>
          </h3>
          <p class="plan__price__description">10 Website</p>
          <p class="plan__price__description">15 GB Hosting</p>
          <p class="plan__price__description plan__price__last">
            Premium Support
          </p>
          <button class="plan__price__btn">Get Started</button>
        </li>
        <li class="plan__price__item">
          <p class="plan__price__type">Enterprise</p>
          <h3 class="plan__price__title">
            $49<span class="plan__price__span">/month</span>
          </h3>
          <p class="plan__price__description">Unlimited Website</p>
          <p class="plan__price__description">50 GB Hosting</p>
          <p class="plan__price__description plan__price__last">
            Premium Support
          </p>
          <button class="plan__price__btn">Get Started</button>
        </li>
      </ul>
    </div>
  </body>
</html>
